[package]
name = "ocb-core"
version = "0.1.0"
edition = "2024"
autotests = false

[lib]
path = "Library.rs"

[[bin]]
name = "ocb-benchmark"
path = "Benchmark.rs"

[[bin]]
name = "ocb-board-benchmark"
path = "BoardBenchmark.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
[[test]]
name = "legacy"
path = "Tests/LegacyTests.rs"
[[test]]
name = "project"
path = "Tests/ProjectTests.rs"
