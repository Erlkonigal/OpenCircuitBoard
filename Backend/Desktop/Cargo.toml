[package]
name = "open-circuit-board"
version = "0.1.0"
edition = "2024"

[lib]
name = "ocb_desktop"
path = "Library.rs"
crate-type = ["rlib"]

[[bin]]
name = "OpenCircuitBoard"
path = "Main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ocb-core = { path = "../Core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[features]
custom-protocol = ["tauri/custom-protocol"]
